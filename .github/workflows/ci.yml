name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Vite ${{ matrix.vite }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        vite: [6, 7, 8]
        include:
          - os: ubuntu-latest
            node: 20
            vite: 8
          - os: ubuntu-latest
            node: 26
            vite: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 10 (bundled with Node 20) crashes on this lockfile; npm 11 supports Node 20.17+.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm install --no-save vite@${{ matrix.vite }}
      - run: npm run lint
      - run: npm test
